# IntelliSchedule — Two-Instance Staging Stack (PostgreSQL 16 + 2x FastAPI + Outbox Worker + Web)
# Run: docker compose -f docker-compose.staging.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intellischedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_change_me}
      POSTGRES_DB: intellischedule
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellischedule -d intellischedule"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-instance-a:
    build: ./apps/api
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://intellischedule:${POSTGRES_PASSWORD:-staging_change_me}@postgres:5432/intellischedule
      DIRECT_URL: postgresql://intellischedule:${POSTGRES_PASSWORD:-staging_change_me}@postgres:5432/intellischedule
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-http://localhost:54321/auth/v1/.well-known/jwks.json}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  api-instance-b:
    build: ./apps/api
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://intellischedule:${POSTGRES_PASSWORD:-staging_change_me}@postgres:5432/intellischedule
      DIRECT_URL: postgresql://intellischedule:${POSTGRES_PASSWORD:-staging_change_me}@postgres:5432/intellischedule
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-http://localhost:54321/auth/v1/.well-known/jwks.json}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  outbox-worker:
    build: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://intellischedule:${POSTGRES_PASSWORD:-staging_change_me}@postgres:5432/intellischedule
    depends_on:
      postgres:
        condition: service_healthy
