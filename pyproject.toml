
[build-system]
requires = ["hatchling","hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "threatlens"
version = "0.0.1"
authors = [
  { name="Vidhi Saxena" },
  { name="Yashti Mittal" },
  { name="Rajat Verma" },
]
# maintainers = [
#   { name="Raghav B. Venkataramaiyer",
#     email="bvraghav@gmail.com" },
# ]
description = "ThreatLens: unified security scanner (Gitleaks + OSV-Scanner + Semgrep)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    # See: https://pypi.org/classifiers/
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Unix Shell",
]
dependencies = ["click"]

[project.urls]
Homepage = "https://github.com/QuantumWizardz/UCS503P_202627_ThreatLens"
Issues = "https://github.com/QuantumWizardz/UCS503P_202627_ThreatLens/issues"

# Adapted from https://stackoverflow.com/a/50156706
[tool.pytest.ini_options]
pythonpath = [
  "project a"
]
testpaths = [
  "project a/tests"
]
# THE END -------------------------------------------
