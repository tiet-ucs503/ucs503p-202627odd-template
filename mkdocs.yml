site_name: "Solar Sage AI — Drone-Based Edge-AI Solar Panel Cleaning"
site_url: https://omkarshukla101.github.io/ucs503p-202627-solar-sage
site_description: "Solar Sage AI: An autonomous drone-based Edge-AI system for condition-based solar panel cleaning. UCS503P Software Engineering Project at TIET."

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Diagrams: diagrams.md
  - Roadmap: roadmap.md
  - Team: team.md

plugins:
- search
- git-revision-date-localized
- git-authors

theme:
  name: material
  custom_dir: docs/assets/theme-overrides
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - header.autohide
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle-outline
  palette:
    - scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  logo: assets/tiet-logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono

repo_url: https://github.com/omkarshukla101/ucs503p-202627-solar-sage
repo_name: Solar Sage AI
copyright: "Copyright &copy; 2026 Solar Sage AI Team — UCS503P, TIET"

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/omkarshukla101/ucs503p-202627-solar-sage
    name: Solar Sage AI on GitHub

extra_css:
  - assets/stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
- https://unpkg.com/katex@0/dist/katex.min.js

markdown_extensions:
  - abbr
  - md_in_html
  - attr_list
  - toc:
      permalink: true
      toc_depth: 4
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - sane_lists
  - tables
