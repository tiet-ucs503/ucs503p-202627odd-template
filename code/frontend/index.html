<!-- UI for basic checking of backend results -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServeConnect Test Frontend</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #f4f4f4; border: 1px solid #ddd; word-wrap: break-word; }
        .section { margin-bottom: 40px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>ServeConnect - Auth Testing</h1>
    <p>This is a temporary frontend to verify the backend Register and Login APIs.</p>

    <div class="section">
        <h2>Register User</h2>
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="regName" placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="regEmail" placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="regPassword" placeholder="password123">
        </div>
        <div class="form-group">
            <label>Role:</label>
            <select id="regRole">
                <option value="customer">Customer</option>
                <option value="worker">Worker</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <button onclick="register()">Register</button>
        <div id="regResult" class="result">Result will appear here...</div>
    </div>

    <div class="section">
        <h2>Login User</h2>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="logEmail" placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="logPassword" placeholder="password123">
        </div>
        <button onclick="login()">Login</button>
        <div id="logResult" class="result">Result will appear here...</div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/auth';

        async function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const resultBox = document.getElementById('regResult');

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                
                const data = await response.json();
                resultBox.innerHTML = `<strong>Status:</strong> ${response.status}<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                resultBox.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        }

        async function login() {
            const email = document.getElementById('logEmail').value;
            const password = document.getElementById('logPassword').value;
            const resultBox = document.getElementById('logResult');

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                resultBox.innerHTML = `<strong>Status:</strong> ${response.status}<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                resultBox.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        }
    </script>
</body>
</html>
