services:
  # ==========================================================
  # Optional Local PostgreSQL (offline development profile)
  # Run: docker compose --profile local-db up -d postgres
  # ==========================================================
  postgres:
    image: postgres:17-alpine
    container_name: agriconnect-postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: agriconnect
      POSTGRES_USER: agriconnect
      POSTGRES_PASSWORD: agriconnect_local
    ports:
      - "5432:5432"
    volumes:
      - agriconnect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriconnect -d agriconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================
  # AgriConnect Express 5 REST API + Socket.io Server
  # Connects natively to cloud Supabase PostgreSQL 17 cluster
  # ==========================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriconnect-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5001
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================
  # AgriConnect Next.js 16 Web App (Standalone Runner)
  # ==========================================================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5001
    container_name: agriconnect-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agriconnect_postgres_data:
